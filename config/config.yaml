check_interval_seconds: 60  # minimum 30

discord:
  # Channel IDs/role IDs: Developer Mode on, then right-click -> Copy ID.
  # Each can also be set in .env (ALERT_CHANNEL_ID, GUILD_ID, HEALTH_CHANNEL_ID, ALERT_ROLE_ID).
  alert_channel_id: 0
  # guild_id: 0            # makes slash commands appear instantly in your server
  # health_channel_id: 0   # private channel for "monitor is failing" warnings (default: alert channel)
  # alert_role_id: 0       # role to @mention on restock alerts
  vote_reactions: true     # add ✅/❌ under each alert so people can vote on whether it's legit
  # Send every alert from a retailer to its own channel (and optionally ping its own role).
  # A search's/product's own channel_id still wins. 0 = use alert_channel_id.
  retailer_channels:
    walmart: 1558948728990203904   # #walmart
  # retailer_roles:
  #   walmart: 0           # role to @mention for Walmart alerts only

# Watch a Shopify store's search: alerts when a NEW matching listing appears, and when
# a listing goes from unavailable to available. The first check only records what's
# already listed, so adding a store doesn't flood the channel.
searches:
  - id: "dig_30th"                      # keep these ids: the bot's saved history uses them
    store_name: "Double Infinity Gaming"
    store_url: "https://doubleinfinitygaming.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    # Search each set for exactly the product types you want, so single cards
    # can't crowd them out of the top-10 results.
    queries: &pokemon_queries
      - "30th celebration elite trainer box"
      - "30th celebration booster bundle"
      - "ascended heroes elite trainer box"
      - "ascended heroes booster bundle"
      - "prismatic evolutions elite trainer box"
      - "prismatic evolutions booster bundle"
      - "destined rivals elite trainer box"
      - "destined rivals booster bundle"
      - "151 elite trainer box"
      - "151 booster bundle"
    # Only alert on titles that mention Pokémon AND are an ETB or Booster Bundle.
    require_all: &pokemon_require ["pokemon"]
    include_any: &sealed_types ["elite trainer box", "etb", "booster bundle"]
    exclude: &pokemon_exclude ["sleeve", "playmat"]

  # Same settings for more shops (the *names reuse the lists above,
  # so you only edit them in one place).
  - id: "stomping_grounds"
    store_name: "Stomping Grounds TCG"
    store_url: "https://www.stompinggroundstcg.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

  - id: "zulus_games"
    store_name: "Zulu's Games"
    store_url: "https://zulusgames.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

  - id: "knight_and_day"
    store_name: "Knight and Day Games"
    store_url: "https://knightanddaygames.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

  # ---------- Walmart (needs the Walmart .env keys) ----------
  # Two searches + auto-watch, sized for Walmart's 5,000 calls/day (~4,130/day as set up):
  #   1. "walmart"      newest listings, every 5 min        -> brand-new drops    (576/day)
  #   2. "walmart_sets" each set by name, every hour        -> finds item pages   (672/day)
  #      Every ETB/Booster Bundle page it finds is auto-watched: checked every minute
  #      (20 items per API call, up to 40 items total)       -> restocks          (2,880/day)
  # Only Walmart-sold listings alert. A reseller-only page stays watched quietly and
  # alerts the moment Walmart itself sells it. Alerts go to retailer_channels.walmart.
  - id: "walmart"                       # keep this id: saved history uses it
    retailer: "walmart"
    sort: "new"
    queries:
      - "pokemon elite trainer box"
      - "pokemon booster bundle"
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude
    check_every_seconds: 300

  - id: "walmart_sets"
    retailer: "walmart"
    sort: "relevance"
    auto_watch: true
    auto_watch_max_total: 40            # Walmart items watched every minute, incl. products below
    check_every_seconds: 3600
    queries:                            # add a set = add its two lines (+48 calls/day)
      - "pokemon 30th celebration elite trainer box"
      - "pokemon 30th celebration booster bundle"
      - "pokemon delta reign elite trainer box"
      - "pokemon delta reign booster bundle"
      - "pokemon pitch black elite trainer box"
      - "pokemon pitch black booster bundle"
      - "pokemon chaos rising elite trainer box"
      - "pokemon chaos rising booster bundle"
      - "pokemon perfect order elite trainer box"
      - "pokemon perfect order booster bundle"
      - "pokemon ascended heroes elite trainer box"
      - "pokemon ascended heroes booster bundle"
      - "pokemon phantasmal flames elite trainer box"
      - "pokemon phantasmal flames booster bundle"
      - "pokemon mega evolution elite trainer box"
      - "pokemon mega evolution booster bundle"
      - "pokemon prismatic evolutions elite trainer box"
      - "pokemon prismatic evolutions booster bundle"
      - "pokemon destined rivals elite trainer box"
      - "pokemon destined rivals booster bundle"
      - "pokemon journey together elite trainer box"
      - "pokemon journey together booster bundle"
      - "pokemon 151 elite trainer box"
      - "pokemon 151 booster bundle"
      - "pokemon black bolt elite trainer box"
      - "pokemon black bolt booster bundle"
      - "pokemon white flare elite trainer box"
      - "pokemon white flare booster bundle"
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude
    # max_price: 69.99                  # skip marked-up listings (applies to auto-watched items too)

# Single product pages to watch (optional; the searches above already cover these stores).
products:
  # Shopify card shop: paste the product page URL (must contain /products/).
  # - id: "shop_151_etb"
  #   name: "Scarlet & Violet 151 ETB"
  #   retailer: "shopify"
  #   store_name: "My Local Card Shop"
  #   url: "https://example-card-shop.com/products/scarlet-violet-151-elite-trainer-box"

  # Best Buy (needs BESTBUY_API_KEY in .env; keys require a company email).
  # - id: "bb_151_etb"
  #   name: "Scarlet & Violet 151 ETB"
  #   retailer: "bestbuy"
  #   url: "https://www.bestbuy.com/site/..."
  #   sku: 1234567

  # Walmart (needs WALMART_CONSUMER_ID + WALMART_PRIVATE_KEY_PATH in .env).
  # Only counts as in stock when Walmart itself sells it, unless allow_marketplace: true.
  # All Walmart products are checked together in ONE API call (up to 20 per call), so 20 items
  # cost the same ~1,440 calls/day as one (limit: 5,000/day).
  # Find item ids in Discord with /walmartfind; then url can be left out:
  #   - id: "wm_chaos_rising_bb"
  #     name: "Chaos Rising Booster Bundle"
  #     retailer: "walmart"
  #     item_id: 1234567890
  # Optional: max_price: 59.99 to ignore marked-up prices.
  - id: "wm_30th_etb"
    name: "30th Celebration Elite Trainer Box"
    retailer: "walmart"
    url: "https://www.walmart.com/ip/Pokemon-TCG-30th-Celebration-Elite-Trainer-Box/20640569221"

  - id: "wm_30th_booster_bundle"
    name: "30th Celebration Booster Bundle"
    retailer: "walmart"
    url: "https://www.walmart.com/ip/Pokemon-TCG-30th-Anniversary-Booster-Bundle-Box/20717271194"

# What plain /walmartfind searches for (one Walmart API call per line, only when you run it).
walmart_find_queries:
  - "30th celebration booster bundle"
  - "30th celebration elite trainer box"
  - "chaos rising booster bundle"
  - "pitch black booster bundle"
  - "perfect order booster bundle"
  - "delta reign booster bundle"
  - "ascended heroes booster bundle"
  - "prismatic evolutions booster bundle"
  - "phantasmal flames booster bundle"
  - "151 booster bundle"
  - "white flare booster bundle"
  - "black bolt booster bundle"
