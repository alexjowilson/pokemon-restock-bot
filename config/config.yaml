check_interval_seconds: 60  # minimum 30

discord:
  # Channel IDs/role IDs: Developer Mode on, then right-click -> Copy ID.
  # Each can also be set in .env (ALERT_CHANNEL_ID, GUILD_ID, HEALTH_CHANNEL_ID, ALERT_ROLE_ID).
  alert_channel_id: 0
  # guild_id: 0            # makes slash commands appear instantly in your server
  # health_channel_id: 0   # private channel for "monitor is failing" warnings (default: alert channel)
  # alert_role_id: 0       # role to @mention on restock alerts
  vote_reactions: true     # add ✅/❌ under each alert so people can vote on whether it's legit

# Watch a Shopify store's search: alerts when a NEW matching listing appears, and when
# a listing goes from unavailable to available. The first check only records what's
# already listed, so adding a store doesn't flood the channel.
searches:
  - id: "dig_30th"                      # keep these ids: the bot's saved history uses them
    store_name: "Double Infinity Gaming"
    store_url: "https://doubleinfinitygaming.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    # Search each set for exactly the product types you want, so single cards
    # can't crowd them out of the top-10 results.
    queries: &pokemon_queries
      - "30th celebration elite trainer box"
      - "30th celebration booster bundle"
      - "ascended heroes elite trainer box"
      - "ascended heroes booster bundle"
      - "prismatic evolutions elite trainer box"
      - "prismatic evolutions booster bundle"
      - "destined rivals elite trainer box"
      - "destined rivals booster bundle"
      - "151 elite trainer box"
      - "151 booster bundle"
    # Only alert on titles that mention Pokémon AND are an ETB or Booster Bundle.
    require_all: &pokemon_require ["pokemon"]
    include_any: &sealed_types ["elite trainer box", "etb", "booster bundle"]
    exclude: &pokemon_exclude ["sleeve", "playmat"]

  # Same settings for more shops (the *names reuse the lists above,
  # so you only edit them in one place).
  - id: "stomping_grounds"
    store_name: "Stomping Grounds TCG"
    store_url: "https://www.stompinggroundstcg.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

  - id: "zulus_games"
    store_name: "Zulu's Games"
    store_url: "https://zulusgames.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

  - id: "knight_and_day"
    store_name: "Knight and Day Games"
    store_url: "https://knightanddaygames.com"
    channel_id: 0
    queries: *pokemon_queries
    require_all: *pokemon_require
    include_any: *sealed_types
    exclude: *pokemon_exclude

# Single product pages to watch (optional; the searches above already cover these stores).
products: []
  # Shopify card shop: paste the product page URL (must contain /products/).
  # - id: "shop_151_etb"
  #   name: "Scarlet & Violet 151 ETB"
  #   retailer: "shopify"
  #   store_name: "My Local Card Shop"
  #   url: "https://example-card-shop.com/products/scarlet-violet-151-elite-trainer-box"

