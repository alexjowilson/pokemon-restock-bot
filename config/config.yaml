check_interval_seconds: 60  # minimum 30

discord:
  # Channel IDs/role IDs: Developer Mode on, then right-click -> Copy ID.
  # Each can also be set in .env (ALERT_CHANNEL_ID, GUILD_ID, HEALTH_CHANNEL_ID, ALERT_ROLE_ID).
  alert_channel_id: 0
  # guild_id: 0            # makes slash commands appear instantly in your server
  # health_channel_id: 0   # private channel for "monitor is failing" warnings (default: alert channel)
  # alert_role_id: 0       # role to @mention on restock alerts
  vote_reactions: true     # add ✅/❌ under each alert so people can vote on whether it's legit

# Watch a Shopify store's search: alerts when a NEW matching listing appears, and when
# a listing goes from unavailable to available. The first check only records what's
# already listed, so adding a store doesn't flood the channel.
searches:
  - id: "dig_30th"                      # keep this id: the bot's saved history uses it
    store_name: "Double Infinity Gaming"
    store_url: "https://doubleinfinitygaming.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    queries: &pokemon_queries           # each query returns up to 10 matches; be specific
      - "30th celebration"
      - "ascended heroes"
      - "prismatic evolutions"
      - "destined rivals"
      - "scarlet violet 151"
    exclude: &pokemon_exclude ["sleeve", "playmat"]   # skip titles containing any of these

  # Same keywords for more shops (*pokemon_queries reuses the list above,
  # so you only edit keywords in one place).
  - id: "stomping_grounds"
    store_name: "Stomping Grounds TCG"
    store_url: "https://www.stompinggroundstcg.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    queries: *pokemon_queries
    exclude: *pokemon_exclude

  - id: "zulus_games"
    store_name: "Zulu's Games"
    store_url: "https://zulusgames.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    queries: *pokemon_queries
    exclude: *pokemon_exclude

  - id: "knight_and_day"
    store_name: "Knight and Day Games"
    store_url: "https://knightanddaygames.com"
    channel_id: 0                       # paste this store's channel ID (0 = main alerts channel)
    queries: *pokemon_queries
    exclude: *pokemon_exclude

products:
  - id: "demo_pikachu"
    name: "Pikachu Demo Product"
    retailer: "demo"
    url: "https://example.com/pikachu"
    demo_in_stock: true

  - id: "dig_30th_booster_bundle"
    name: "30th Celebration Booster Bundle"
    retailer: "shopify"
    store_name: "Double Infinity Gaming"
    url: "https://doubleinfinitygaming.com/products/pokemon-tcg-30th-celebration-booster-bundle-presale-expected-release-date-october-2nd-2026"

